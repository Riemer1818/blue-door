# Local Postgres that mirrors the Scaleway managed instance closely enough for
# row-level security to behave identically: same engine major, and the app
# connects as a non-owner role here too. If RLS is wrong, it is wrong locally.
#
#   docker compose -f docker-compose.local.yml up -d
#   ./db/apply.sh
#   ./db/seed-dev.sh
services:
  postgres:
    image: postgres:16-alpine
    container_name: bluedoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluedoor
      # The runtime role's local password. Mirrors what Terraform generates in
      # the cloud; only ever a local-development value.
      BLUEDOOR_APP_PASSWORD: bluedoor_app
    ports:
      # 5433 so it cannot collide with a Postgres already on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/local/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluedoor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for the things Postgres should not hold: input
  # datasets, tool outputs, fixtures and goldens. Deliberately S3-shaped so the
  # same client speaks to Scaleway Object Storage in production - EU-hosted, and
  # already the provider in infra/terraform.
  #
  # Files are not documents. nodes.content is a BlockNote jsonb document and was
  # never going to hold a 2 MB FASTQ; this is where bytes live.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: bluedoor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bluedoor
      MINIO_ROOT_PASSWORD: bluedoor_dev_secret
    ports:
      # 9000 is the S3 API, 9001 the web console. Bound to localhost only.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
