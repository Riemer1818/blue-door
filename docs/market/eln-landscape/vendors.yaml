  # ---------- Layer 2: data plumbing ----------

  - name: TetraScience
    layer: 2
    ai_depth: through-workflow
    hq: Boston, US
    founded: 2014
    funding: "$80M Series B"
    valuation: null
    url: https://www.tetrascience.com
    url_verified: false
