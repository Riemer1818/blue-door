# ELN / lab-software competitive landscape -- structured source of truth.
#
# This file is the expandable part of the system: adding a competitor means appending
# one record here, then mentioning it in README.md only if it changes the narrative.
# The prose doc is the read; this file is the data.
#
# Field contract:
#   name          required
#   layer         1 | 1b | 2 | 3 | 4   (see README.md for what each layer means)
#   ai_depth      none | bolt-on | through-workflow | ai-native
#   hq            city, country
#   founded       year, or null
#   funding       last PUBLICLY DISCLOSED figure, as a string incl. its date. Never "current".
#   valuation     string incl. its date, or null
#   url           vendor homepage
#   url_verified  true only if someone actually opened it. Default false.
#   sources       list of ids from sources.md
#   note          one paragraph: what they are and where they are weak
#   as_of         when this record was last checked against reality
#
# Everything here is a snapshot. Funding and pricing rot fastest; treat any record
# whose as_of is more than ~6 months old as ASSUMED, not VERIFIED.

meta:
  compiled: 2026-08-31
  compiled_by: riemer
  method: web scan, secondary sources only -- no vendor calls, no demos, no pricing pages pulled
  confidence: >
    Positioning and layer assignments are our read. Funding figures are as last disclosed
    by the cited source and may be stale. Nothing here has been verified with the vendor.

vendors:

  # ---------- Layer 1: incumbents, system of record, enterprise pricing ----------

  - name: Benchling
    layer: 1
    ai_depth: bolt-on
    hq: San Francisco, US
    founded: 2012
    funding: "$412M raised (last disclosed)"
    valuation: "$6.1B (2021)"
    url: https://www.benchling.com
    url_verified: false
    sources: [sacra-benchling, 37degrees]
    as_of: 2026-08-31
    note: >
      The default for molecular biology. Sequence-aware ELN plus registry, inventory and
      workflows. Free for academics, which is how it won bottom-up. ~$210M ARR reported as of
      May 2024, ~1,300 customers, ~$175K average contract. AI arrived as a layer -- an Anthropic
      partnership and structural-biology model integrations -- rather than a rebuild, so the
      schema underneath is still a decade old.

  - name: Dotmatics
    layer: 1
    ai_depth: bolt-on
    hq: Boston, US
    founded: null
    funding: "acquired by Siemens for $5.1B, closed 2025"
    valuation: "$5.1B (acquisition, 2025)"
    url: https://www.dotmatics.com
    url_verified: false
    sources: [siemens-dotmatics, rdworld-labos]
    as_of: 2026-08-31
    note: >
      Broad chemistry-first R&D suite; GraphPad, SnapGene and Geneious sit under the same roof.
      Folded into Siemens' AI software portfolio. Expect deep integration with industrial/PLM
      tooling and slow product velocity while that integration happens -- which is a window.

  - name: Sapio Sciences
    layer: 1
    ai_depth: through-workflow
    hq: Baltimore, US
    founded: 2007
    funding: null
    valuation: null
    url: https://www.sapiosciences.com
    url_verified: false
    sources: [sapio-elain, rdworld-labos]
    as_of: 2026-08-31
    note: >
      The incumbent that moved fastest on AI, and the most aggressive incumbent repositioning
      in the set. ELaiN launched Sept 2025, marketed as a "third-generation AI lab notebook" /
      co-scientist; partner ecosystem opened Jan 2026 with NVIDIA BioNeMo, Elsevier and
      DISGENET. Their pitch leans on two numbers from their own research -- 45% of scientists
      already use shadow GenAI, 65% repeat experiments they cannot find. Both are vendor-run
      research; useful framing, not independent evidence.

  - name: SciSure
    layer: 1
    ai_depth: bolt-on
    hq: Groningen, NL + Boston, US
    founded: null
    funding: null
    valuation: null
    url: https://www.scisure.com
    url_verified: false
    sources: [scisure-labfolder, 37degrees]
    as_of: 2026-08-31
    note: >
      The European roll-up and the most direct incumbent in our own back yard. eLabNext (Dutch)
      merged with SciShield, then acquired Labfolder and Labregister from Berlin's Labforward in
      Sept 2025. Strong in academic and mid-market EU labs where data residency matters. AI is
      early -- which is precisely the gap the EU-sovereignty wedge aims at.

