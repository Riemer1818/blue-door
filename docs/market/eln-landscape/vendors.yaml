# ---------------------------------------------------------------------------
# Adjacent categories -- not ELN vendors, but what a lab actually uses instead.
# These win deals that never appear on a competitive shortlist, so they are not
# in the `vendors` list above and are not counted in any layer tally.
# Added 2026-08-31 from the June field notes; see docs/product/user-research/.
# ---------------------------------------------------------------------------

adjacent_categories:

  - name: The route-around stack
    kind: incumbent-by-default
    examples: [OneNote, Microsoft Word, Microsoft Excel, OneDrive, Obsidian, Nextcloud, thegood.cloud]
    evidence: [jenny-bakker-2026-06-16, niels-dam-2026-06-18]
    as_of: 2026-08-31
    note: >
      What the lab journal is actually kept in. Jenny Bakker uses eLABjournal (SciSure) for the
      strain collection and protocol sharing, but keeps the journal itself in OneNote and growth
      experiment data in Word/Excel on OneDrive, because the ELN is "barely usable on the phone".
      Niels Dam keeps Obsidian notes beside the ELN because the ELN is not LLM-searchable.
      Free, already installed, zero switching cost, and no vendor to displace. This is the real
      competitor and it appears on no market map.

  - name: University "academic AI" portals
    kind: adjacent-substitute
    examples: [institution-provided LLM platforms, EU-hosted, university-funded]
    evidence: [niels-dam-2026-06-18]
    as_of: 2026-08-31
    note: >
      Institutional AI platforms -- chat, custom assistants, a settings "lab" -- paid for by the
      university and processed within the EU. Researchers use these on real research data
      precisely because they will not hand it to external AI. Free at the point of use, already
      EU-hosted, already trusted. Either the main obstacle to an EU-sovereignty pitch or its
      distribution channel. OPEN: we do not know which platform, who operates it, or how it is
      procured -- that is the single most valuable unknown on this board.
