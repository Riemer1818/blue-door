    valuation: null
    url: https://www.elabftw.net
    url_verified: false
    sources: [37degrees]
    as_of: 2026-08-31
    note: >
      The most polished open-source ELN and the single most important vendor on this board for
      us. Free self-hosted, AGPL. Very strong in European academia for GDPR and data-sovereignty
      reasons. No AI. It caps what we can charge small EU labs, and it is the incumbent our
      self-hostable positioning has to beat on something other than price.

