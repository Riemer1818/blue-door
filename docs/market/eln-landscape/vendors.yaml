    note: >
      The scientific data cloud: ingest from instruments, harmonize into engineered schemas,
      feed downstream AI. Partnered with Google Cloud. Closest thing the category has to a
      standard for instrument data -- so a likely integration target, not only a competitor.

  - name: Ganymede
    layer: 2
