    as_of: 2026-08-31
    note: >
      The most commercially visible AI-native challenger. Positions as an "AI-native operating
      layer" -- ELN + LIMS + integrations -- with Scibot as the agent over lab data. Also
      running an aggressive comparison-content SEO play against every incumbent, which is worth
      studying as a go-to-market in its own right. US/CA SaaS, so no EU-residency answer.

